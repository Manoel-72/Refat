[package]
name = "rs2br-engine"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "rs2br-engine"
path = "src/main.rs"

[dependencies]
# UI framework nativa (pura Rust, sem deps externas pesadas)
eframe = { version = "0.28", features = ["default"] }
egui = "0.28"

# Renderização 2D
macroquad = "0.4"
image = "0.25"
rfd = "0.14"

# Serialização para salvar/carregar cenas
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID para identificar entidades únicas
uuid = { version = "1", features = ["v4"] }

# Log
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3

[build-dependencies]
winres = "0.1"
